<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Admin Password | The Drive Leadership</title>
  <link rel="stylesheet" href="admin.css">
</head>
<body class="admin-auth-body">
  <main class="auth-shell">
    <section class="auth-panel">
      <div class="auth-brand">
        <img src="../drive.png" alt="Drive Leadership logo">
        <div><p class="eyebrow">Internal access</p><h1>Drive Leadership</h1></div>
      </div>
      <div class="auth-copy">
        <p class="eyebrow accent">Account recovery</p>
        <h2>Reset password</h2>
        <p>Request a secure reset link or set a new password from the link sent to your email.</p>
      </div>
      <form id="reset-request-form" class="auth-form" novalidate>
        <div class="field"><label for="reset-email">Admin email</label><input id="reset-email" name="email" type="email" required></div>
        <div id="reset-request-message" class="form-message" aria-live="polite"></div>
        <button type="submit" class="primary-btn"><span>Send reset link</span></button>
      </form>
      <form id="reset-password-form" class="auth-form" hidden novalidate>
        <div class="field"><label for="new-password">New password</label><input id="new-password" name="password" type="password" minlength="12" required></div>
        <div class="field"><label for="confirm-password">Confirm password</label><input id="confirm-password" name="confirm_password" type="password" minlength="12" required></div>
        <div id="reset-password-message" class="form-message" aria-live="polite"></div>
        <button type="submit" class="primary-btn"><span>Update password</span></button>
      </form>
      <a class="text-link" href="login.html">Return to login</a>
    </section>
  </main>
  <script src="admin.js?v=13"></script>
</body>
</html>
