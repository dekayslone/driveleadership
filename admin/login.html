<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Login | The Drive Leadership</title>
    <meta name="description" content="Demo admin login page for The Drive Leadership internal dashboard." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="admin.css" />
  </head>
  <body class="admin-auth-body">
    <main class="auth-shell">
      <section class="auth-panel">
        <div class="auth-brand" aria-label="Drive Leadership brand">
          <img src="../drive.png" alt="Drive Leadership logo" />
          <div>
            <p class="eyebrow">Internal access</p>
            <h1>Drive Leadership</h1>
          </div>
        </div>

        <div class="auth-copy">
          <p class="eyebrow accent">Admin portal</p>
          <h2>Welcome back</h2>
          <p>Use your team credentials to access the management dashboard.</p>
        </div>

        <form id="admin-login-form" class="auth-form" novalidate>
          <div class="field">
            <label for="login-email">Email address</label>
            <input id="login-email" name="email" type="email" autocomplete="email" placeholder="thedrive009@gmail.com" required />
          </div>

          <div class="field">
            <label for="login-password">Password</label>
            <div class="password-wrap">
              <input id="login-password" name="password" type="password" autocomplete="current-password" placeholder="Enter your password" required />
              <button type="button" class="password-toggle" aria-label="Show password">Show</button>
            </div>
          </div>

          <div class="form-meta">
            <label class="checkbox-wrap">
              <input type="checkbox" name="remember" />
              <span>Remember me</span>
            </label>
            <a href="reset-password.html" class="text-link">Forgot password?</a>
          </div>

          <div id="login-message" class="form-message" aria-live="polite"></div>

          <button type="submit" class="primary-btn" id="login-button">
            <span class="btn-label">Sign in</span>
          </button>
        </form>
      </section>
    </main>

    <script src="admin.js?v=13"></script>
  </body>
</html>
